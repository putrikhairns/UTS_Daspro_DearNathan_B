<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">MINT - Mini Interactive Teller</title>
  <desc id="d">Banner program MINT: judul di kiri, jendela terminal ATM di kanan, latar hijau zamrud bermotif titik dan cincin koin</desc>
  <defs>
    <radialGradient id="cahaya" cx="0.80" cy="0.50" r="0.75">
      <stop offset="0" stop-color="#0F7A5E"/>
      <stop offset="0.55" stop-color="#073F33"/>
      <stop offset="1" stop-color="#031A15"/>
    </radialGradient>
    <radialGradient id="emas" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.6" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#D49A12"/>
    </radialGradient>
    <linearGradient id="garis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="titik" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#5EEAB0" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- latar -->
  <rect width="1200" height="340" fill="url(#cahaya)"/>
  <rect width="1200" height="340" fill="url(#titik)"/>

  <!-- cincin tepi koin -->
  <g fill="none" stroke="#5EEAB0">
    <circle cx="900" cy="170" r="250" stroke-width="2" opacity="0.07"/>
    <circle cx="900" cy="170" r="215" stroke-width="2" opacity="0.09"/>
    <circle cx="900" cy="170" r="180" stroke-width="2" opacity="0.11"/>
  </g>

  <!-- teks kiri -->
  <text x="64" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="800" letter-spacing="10" fill="#ECFDF5">MINT</text>
  <text x="68" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" fill="#A7F3D0">Mini Interactive Teller</text>

  <!-- bar loading, mengingatkan pada layar pembuka program -->
  <g>
    <rect x="68" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="92" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="116" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="140" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="164" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="188" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="212" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="236" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="260" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="284" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="308" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="332" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="356" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="380" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="1"/>
    <rect x="404" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="0.25"/>
    <rect x="428" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="0.25"/>
    <rect x="452" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="0.25"/>
    <rect x="476" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="0.25"/>
    <rect x="500" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="0.25"/>
    <rect x="524" y="236" width="18" height="10" rx="2" fill="#F5C542" opacity="0.25"/>
  </g>
  <text x="68" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#ECFDF5" opacity="0.85">Simulasi ATM berbasis Pascal</text>

  <!-- jendela terminal -->
  <g>
    <rect x="690" y="52" width="420" height="228" rx="12" fill="#04211B" stroke="#34D399" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M690 64 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v22 h-420 z" fill="#0B3D32"/>
    <circle cx="716" cy="69" r="6" fill="#F5C542"/>
    <circle cx="738" cy="69" r="6" fill="#5EEAB0"/>
    <circle cx="760" cy="69" r="6" fill="#ECFDF5" opacity="0.75"/>
    <text x="1096" y="74" text-anchor="end" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="15" fill="#A7F3D0" opacity="0.8">MINT.exe</text>

    <text x="716" y="128" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" fill="#ECFDF5">Masukkan PIN: ****</text>
    <text x="716" y="164" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" fill="#5EEAB0">Login berhasil.</text>
    <text x="716" y="200" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" fill="#F5C542">Saldo Anda: Rp500000</text>
    <text x="716" y="244" font-family="'Cascadia Mono','Consolas','Courier New',monospace" font-size="21" fill="#ECFDF5">&gt;</text>
    <rect x="738" y="228" width="12" height="20" fill="#5EEAB0">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- koin menimpa sudut jendela -->
  <g>
    <g>
      <circle cx="1110" cy="268" r="46" fill="url(#emas)"/>
      <circle cx="1110" cy="268" r="36" fill="none" stroke="#B8860B" stroke-width="3"/>
      <text x="1110" y="268" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI',Arial,sans-serif" font-size="53" font-weight="800" fill="#9A6F0B">$</text>
    </g>
    <g>
      <circle cx="1036" cy="296" r="26" fill="url(#emas)"/>
      <circle cx="1036" cy="296" r="20" fill="none" stroke="#B8860B" stroke-width="2"/>
      <text x="1036" y="296" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#9A6F0B">$</text>
    </g>
  </g>

  <!-- garis aksen bawah -->
  <rect x="0" y="334" width="1200" height="6" fill="url(#garis)"/>
</svg>
